global
    maxconn 20000
    nbthread 1
    hard-stop-after 1s
    tune.rcvbuf.client 16384
    tune.rcvbuf.server 16384
    tune.sndbuf.client 16384
    tune.sndbuf.server 16384

defaults
    mode tcp
    maxconn 20000
    timeout connect 100ms
    timeout client 3s
    timeout server 3s
    option splice-auto
    option dontlognull
    option tcpka
    no log

frontend rinha_front
    bind *:9999
    default_backend rinha_api

backend rinha_api
    balance roundrobin
    server api1 unix@/run/sock/api1.sock maxconn 10000
    server api2 unix@/run/sock/api2.sock maxconn 10000
