services:
  haproxy:
    image: haproxy:3.1-alpine
    volumes:
      - ../lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sock:/run/sock
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "10M"
    depends_on:
      - api1
      - api2
    networks:
      - rinha

  api1: &api
    image: ghcr.io/jordaogustavo/rinha-api-swift:latest
    security_opt:
      - seccomp=unconfined
    environment:
      INDEX_PATH: /data/ivf.bin
      EXACT_PATH: /data/exact.bin
      RESOURCES_PATH: /resources
      SOCKET_PATH: /run/sock/api1.sock
      NPROBE_FULL: "20"
    volumes:
      - sock:/run/sock
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170M"
    networks:
      - rinha

  api2:
    <<: *api
    environment:
      INDEX_PATH: /data/ivf.bin
      EXACT_PATH: /data/exact.bin
      RESOURCES_PATH: /resources
      SOCKET_PATH: /run/sock/api2.sock
      NPROBE_FULL: "20"

volumes:
  sock:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1M,nr_inodes=8,mode=0777,noatime,nosuid,nodev"

networks:
  rinha:
    driver: bridge
