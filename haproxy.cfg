global
    maxconn 20000
    nbthread 1

defaults
    mode tcp
    timeout connect 5s
    timeout client  60s
    timeout server  60s

frontend fe
    bind :9999
    default_backend be

backend be
    balance roundrobin
    server api1 unix@/run/sock/api1.sock check inter 2s fall 3 rise 2
    server api2 unix@/run/sock/api2.sock check inter 2s fall 3 rise 2
